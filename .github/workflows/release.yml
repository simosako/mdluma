name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Release Artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $dir = "mdluma-$version"
          New-Item -ItemType Directory -Path "$dir\licenses" -Force
          Copy-Item "target\x86_64-pc-windows-msvc\release\mdluma.exe" "$dir\"
          Copy-Item "vendor\sciter-js-sdk-main\bin\windows\x64\sciter.dll" "$dir\"
          Copy-Item "README.md" "$dir\"
          Copy-Item "vendor\sciter-js-sdk-main\LICENSE" "$dir\licenses\Sciter-LICENSE"
          Copy-Item "vendor\sciter-js-sdk-main\SCITER-ENGINE-EULA.md" "$dir\licenses\"
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: mdluma-*.zip
          generate_release_notes: true
