[package]
name = "mdluma"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
build = "build.rs"
license = "MIT OR Apache-2.0"

[[bin]]
name = "mdluma"
path = "src/main.rs"

[dependencies]
comrak = { version = "0.52", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
